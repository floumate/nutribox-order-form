<!--
  ============================================================
  Order forma — Webflow embed  ·  STAGING
  ============================================================
  Nalepiti SAMO na vuksanvasic.webflow.io (testna stranica).
  Na nutribox.rs ide order-form-embed.html.

  Razlika u odnosu na produkcioni embed je JEDNA linija:
      var ENV_PARAM = "env=staging";

  Zašto uopšte parametar: forma je u iframe-u na floumate.github.io, pa
  iznutra ne vidi da li je embedovana na nutribox.rs ili na webflow.io -
  location.hostname joj je uvek github.io. Okruženje mora da stigne odavde.

  Sa env=staging forma:
    - uključuje kartično plaćanje (na produkciji je ugašeno)
    - gađa customer-api.staging.nutribox.dev/card-payments/checkout
    - thank-you stranice traži na vuksanvasic.webflow.io
    - šalje env:"staging" u Make payload (za filter test porudžbina)

  Ako se ovo zabunom zalepi na nutribox.rs, forma svejedno forsira prod
  (proverava roditeljski domen) - ali ne oslanjaj se na to.
-->

<iframe id="nutribox-form"
        src="https://floumate.github.io/nutribox-order-form/?env=staging"
        style="width:100%;height:600px;border:0;display:block;"
        scrolling="no"></iframe>

<script>
(function () {
  var BASE = "https://floumate.github.io/nutribox-order-form/";
  var ENV_PARAM = "env=staging";   // <-- produkcioni embed nema ovu liniju

  var iframe = document.getElementById("nutribox-form");

  // Prosledi URL params (affiliate, discountCode, setter, referred_by...)
  // u iframe, zadržavajući env.
  var parts = [ENV_PARAM];
  var qs = window.location.search.replace(/^\?/, "");
  if (qs) parts.push(qs);
  iframe.src = BASE + "?" + parts.join("&");

  window.addEventListener("message", function (e) {
    // Sigurnost: primaj SAMO od forme.
    if (e.origin !== "https://floumate.github.io") return;
    var data = e.data || {};

    // Auto-visina (nema skrolovanja unutar iframe-a).
    if (data.type === "nutribox-height" && typeof data.height === "number") {
      iframe.style.height = data.height + "px";
    }

    // Vrati korisnika na vrh forme kad pređe na sledeći korak.
    // Namerno bez "smooth" - ignoriše se kad je uključeno smanjenje
    // animacija, pa se tada ne bi skrolovalo uopšte.
    if (data.type === "nutribox-scroll") {
      var top = iframe.getBoundingClientRect().top + window.scrollY;
      window.scrollTo(0, top - 20);
    }

    // Redirect (kartica → checkout / pouzeće → thank-you).
    // Parent navigira da bi query params ostali sačuvani.
    if (data.type === "nutribox-redirect" && data.url) {
      window.location.href = data.url;
    }
  });
})();
</script>

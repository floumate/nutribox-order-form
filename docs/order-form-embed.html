<!--
  ============================================================
  Order forma — Webflow embed  (JEDINI, za sve stranice)
  ============================================================
  Nalepiti u Embed element na stranici /order-form.
  Publikovati na OBA domena - nutribox.rs i vuksanvasic.webflow.io.

  Ne postoji zasebna verzija za produkciju i za test. Ovo je jedini embed;
  ponašanje bira sama forma, po domenu roditeljske stranice:

      nutribox.rs            → produkcija (kartica ugašena, prenos na račun)
      vuksanvasic.webflow.io → staging    (kartica radi, test okruženje)

  Zato `env=staging` stoji u kodu i kad se publikuje na produkciju: tamo se
  IGNORIŠE. Isto važi kad se roditeljski domen uopšte ne pročita - tada se
  ide na produkciju. Logika je u src/config/env.ts.

  Zašto uopšte parametar: forma je u iframe-u na floumate.github.io, pa
  iznutra ne vidi na kom je domenu - location.hostname joj je uvek github.io.
  Okruženje mora da stigne odavde.

  ⚠️ Ne praviti "verziju bez env-a" za produkciju. Webflow je jedan sajt sa
  jednim sadržajem: prvi sledeći publish produkcije ionako prenese ono što
  trenutno stoji na stranici. Ručno vraćanje embeda pre svakog publish-a se
  zaboravi - zato odluku donosi kod, a ne čovek.

  Tri stvari koje roditeljska stranica mora da radi:
    nutribox-height    → visina iframe-a prati sadržaj koraka
    nutribox-scroll    → vrati na vrh forme pri prelasku na sledeći korak
                         (iz iframe-a se ne može skrolovati roditelj)
    nutribox-redirect  → navigacija na checkout / thank-you stranicu
                         (roditelj navigira da query params ostanu)

  height:600px na iframe-u je POČETNA visina, dok se JS ne učita - bez nje
  browser koristi default 150px i forma se prvih ~150ms vidi presečena.
-->

<iframe id="nutribox-form"
        src="https://floumate.github.io/nutribox-order-form/?env=staging"
        style="width:100%;height:600px;border:0;display:block;"
        scrolling="no"></iframe>

<script>
(function () {
  var BASE = "https://floumate.github.io/nutribox-order-form/";
  var ENV_PARAM = "env=staging";

  var iframe = document.getElementById("nutribox-form");

  // Prosledi URL params (affiliate, discountCode, setter, referred_by...)
  // u iframe, zadržavajući env.
  var parts = [ENV_PARAM];
  var qs = window.location.search.replace(/^\?/, "");
  if (qs) parts.push(qs);
  iframe.src = BASE + "?" + parts.join("&");

  window.addEventListener("message", function (e) {
    // Sigurnost: primaj SAMO od forme.
    if (e.origin !== "https://floumate.github.io") return;
    var data = e.data || {};

    // Auto-visina (nema skrolovanja unutar iframe-a).
    if (data.type === "nutribox-height" && typeof data.height === "number") {
      iframe.style.height = data.height + "px";
    }

    // Vrati korisnika na vrh forme kad pređe na sledeći korak.
    // Bez ovoga iOS Safari ostavlja korisnika na staroj visini i ne vidi
    // naslov novog koraka. Namerno bez "smooth" - ignoriše se kad je
    // uključeno smanjenje animacija, pa se tada ne bi skrolovalo uopšte.
    if (data.type === "nutribox-scroll") {
      var top = iframe.getBoundingClientRect().top + window.scrollY;
      window.scrollTo(0, top - 20);
    }

    // Redirect (kartica → checkout / pouzeće → thank-you).
    // Parent navigira da bi query params ostali sačuvani.
    if (data.type === "nutribox-redirect" && data.url) {
      window.location.href = data.url;
    }
  });
})();
</script>
